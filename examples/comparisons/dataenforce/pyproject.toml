    "dataenforce>=0.1.2",
    "mypy>=2.4.0",
    "pandas>=3.0.1",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "typedframes[mypy]>=0.9.0",
]
