[project]
name = "duckdb-connector-example"
version = "0.1.0"
description = "Runnable typedframes example: SQL column inference against DuckDB"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.0",
    "polars>=1.0",
    "pyarrow>=15.0",
]

[dependency-groups]
dev = [
    "typedframes[mypy]",
]

[tool.uv.sources]
typedframes = { path = "../../..", editable = true }

[tool.typedframes]
enabled = true
sql_dialect = "duckdb"
