services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "yourStrong(!)Password"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "yourStrong(!)Password"
          -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      mssql:
        condition: service_healthy
