[project]
name = "narwhals-examples"
version = "0.1.0"
description = "Example comparing narwhals with typedframes"
requires-python = ">=3.11"
dependencies = [
    "narwhals>=2.27.1",
    "pandas",
    "polars",
    "mypy",
    "typedframes[mypy]>=0.9.0",
    "pandas-stubs>=3.0.5.260914",
]

[tool.typedframes]
enabled = true
