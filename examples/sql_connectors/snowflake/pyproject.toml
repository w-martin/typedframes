[project]
name = "snowflake-connector-example"
version = "0.1.0"
description = "Runnable typedframes example: SQL column inference against Snowflake"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
]

[dependency-groups]
dev = [
    "typedframes[mypy]",
]

[tool.uv.sources]
typedframes = { path = "../../..", editable = true }

[tool.typedframes]
enabled = true
sql_dialect = "snowflake"
