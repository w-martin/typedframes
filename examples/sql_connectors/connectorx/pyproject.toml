[project]
name = "connectorx-connector-example"
version = "0.1.0"
description = "Runnable typedframes example: SQL column inference against connectorx"
requires-python = ">=3.11"
dependencies = [
    "connectorx>=0.4.6",
    "pandas>=3.0.6",
]

[dependency-groups]
dev = [
    "typedframes[mypy]",
]

[tool.uv.sources]
typedframes = { path = "../../..", editable = true }

[tool.typedframes]
enabled = true
