[package]
name = "typedframes_checker"
version = "0.14.0"
edition = "2021"
description = "A high-performance Rust-based checker for typedframes DataFrame column schemas"
license = "MIT"
repository = "https://github.com/w-martin/typedframes"
homepage = "https://github.com/w-martin/typedframes"
documentation = "https://github.com/w-martin/typedframes"

[[bin]]
name = "typedframes"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "warn"

[dependencies]
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.16.2" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.16.2" }
ruff_source_file = { git = "https://github.com/astral-sh/ruff", tag = "0.16.2" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.16.2" }
ruff_notebook = { git = "https://github.com/astral-sh/ruff", tag = "0.16.2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
rmp-serde = "1"
anyhow = "1.0"
toml = { version = "1.1", features = ["preserve_order"] }
sqlparser = "0.62"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
# The allocator split ruff and ty use: jemalloc where it builds, mimalloc on Windows (jemalloc
# has no MSVC support), the platform allocator elsewhere. Keep the `cfg`s in `src/lib.rs` in
# step with these. jemalloc is tuned for a short run on many threads in `../.cargo/config.toml`.
[target.'cfg(all(not(target_os = "windows"), not(target_os = "openbsd"), not(target_os = "aix"), not(target_os = "android"), any(target_arch = "x86_64", target_arch = "aarch64", target_arch = "powerpc64", target_arch = "riscv64")))'.dependencies]
tikv-jemallocator = "0.7"

[target.'cfg(target_os = "windows")'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }

[dev-dependencies]
tempfile = "3.8"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "parser_bench"
harness = false
