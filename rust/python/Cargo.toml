[package]
name = "typedframes_python"
version = "0.14.1"
edition = "2021"
description = "The typedframes checker as a Python extension module, for interpreters that may not start new executables"
license = "MIT"
repository = "https://github.com/w-martin/typedframes"

[lib]
name = "_rust"
crate-type = ["cdylib"]

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "warn"

[dependencies]
typedframes_checker = { path = ".." }
# abi3: one build serves every supported Python, so the wheel stays one per platform.
pyo3 = { version = "0.30.1", features = ["abi3-py311", "extension-module"] }

[build-dependencies]
pyo3-build-config = "0.30.1"
