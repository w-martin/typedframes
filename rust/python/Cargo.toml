[package]
name = "typedframes_python"
version.workspace = true
edition.workspace = true
description = "The typedframes checker as a Python extension module, for interpreters that may not start new executables"
license.workspace = true
repository.workspace = true

[lib]
name = "_rust"
crate-type = ["cdylib"]

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "warn"
too_many_lines = "deny"
cognitive_complexity = "deny"
excessive_nesting = "deny"

[features]
# Free-threaded interpreters cannot load an abi3 module. Built with this feature against a free-threaded
# 3.15+ interpreter, the module is `_rust.abi3t.*` (PEP 803), which the wheel carries beside the abi3 one.
abi3t = ["pyo3/abi3t-py315"]

[dependencies]
typedframes_cli.workspace = true
# abi3: one build serves every supported Python, so the wheel stays one per platform.
pyo3 = { version = "0.30.1", features = ["abi3-py311", "extension-module"] }

[build-dependencies]
pyo3-build-config = "0.30.1"
