[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "gx-examples"
version = "0.1.0"
description = "Great Expectations examples and comparison with typedframes"
requires-python = ">=3.11"
dependencies = [
    "great-expectations>=1.23.2",
    "pandas>=2.0.0",
    "mypy>=2.4.0",
]

[dependency-groups]
dev = [
    "typedframes[mypy]>=0.9.0",
    "pandas-stubs>=3.0.5.260914",
]

[tool.setuptools]
packages = []
