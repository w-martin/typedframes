[project]
name = "athena-connector-example"
version = "0.1.0"
description = "Runnable typedframes example: SQL column inference against AWS Athena"
requires-python = ">=3.11"
dependencies = [
    "pyathena>=4.2.1",
    "pandas>=3.1.0",
    "boto3>=1.43.118",
]

[dependency-groups]
dev = [
    "typedframes[mypy]",
    "moto[athena,s3]>=5.2.4",
]

[tool.uv.sources]
typedframes = { path = "../../..", editable = true }

[tool.typedframes]
enabled = true
