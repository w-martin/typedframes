[project]
name = "pandas-stubs-example"
version = "0.1.0"
description = "Comparison of pandas-stubs vs typedframes type checking"
requires-python = ">=3.11"
dependencies = [
    "mypy>=2.4.0",
    "pandas>=3.0.6",
    "pandas-stubs>=3.0.5.260914",
]

[dependency-groups]
dev = [
    "typedframes[mypy]>=0.9.0",
]
