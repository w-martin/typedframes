[project]
name = "static_frame_examples"
version = "0.1.0"
description = "StaticFrame vs typedframes comparison examples"
requires-python = ">=3.11"
dependencies = [
    "mypy>=2.4.0",
    "static-frame>=5.1.1",
]

[dependency-groups]
dev = [
    "pandas>=3.0.6",
    "typedframes[mypy]>=0.9.0",
    "pandas-stubs>=3.0.5.260914",
]

[tool.typedframes]
enabled = true
