[package]
name = "typedframes_cli"
description = "The typedframes command line: argument parsing, file collection, output formats and commands"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[lints]
workspace = true

[[bin]]
name = "typedframes"
path = "src/main.rs"

[dependencies]
typedframes_domain.workspace = true
typedframes_app.workspace = true
typedframes_adapters.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap.workspace = true

# The allocator split ruff and ty use: jemalloc where it builds, mimalloc on Windows (jemalloc
# has no MSVC support), the platform allocator elsewhere. Keep the `cfg`s in `src/lib.rs` in
# step with these. jemalloc is tuned for a short run on many threads in `../../../.cargo/config.toml`.
[target.'cfg(all(not(target_os = "windows"), not(target_os = "openbsd"), not(target_os = "aix"), not(target_os = "android"), any(target_arch = "x86_64", target_arch = "aarch64", target_arch = "powerpc64", target_arch = "riscv64")))'.dependencies]
# No initial-exec TLS: that model fails to `dlopen` into a process that did not link jemalloc at start (the extension module).
tikv-jemallocator.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
tempfile.workspace = true
