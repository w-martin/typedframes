[package]
name = "typedframes_checker"
version = "0.14.2"
edition = "2021"
description = "A high-performance Rust-based checker for typedframes DataFrame column schemas"
license = "MIT"
repository = "https://github.com/w-martin/typedframes"
homepage = "https://github.com/w-martin/typedframes"
documentation = "https://github.com/w-martin/typedframes"

[workspace]
# `python` is the PyO3 glue. PyO3's macros expand to `unsafe`, which this crate forbids, so it is a crate of its own.
members = ["python"]

[[bin]]
name = "typedframes"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
# Panics unwind (the default): this profile also builds the extension module, where a panic must become
# a Python exception and not end the interpreter that loaded it.
strip = "symbols"

# The executable wheel is built with this profile: it never loads into another process, so a panic
# may end it, and it favours size over the last ~10% of speed. The extension module keeps `release`.
[profile.cli]
inherits = "release"
panic = "abort"
opt-level = "s"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "warn"

[dependencies]
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.16.2" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.16.2" }
ruff_source_file = { git = "https://github.com/astral-sh/ruff", tag = "0.16.2" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.16.2" }
ruff_notebook = { git = "https://github.com/astral-sh/ruff", tag = "0.16.2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
rmp-serde = "1"
anyhow = "1.0"
toml = { version = "1.1", features = ["preserve_order"] }
sqlparser = { version = "0.62", default-features = false, features = ["std", "recursive-protection"] }
clap = { version = "4.6.7", features = ["derive"] }
# The allocator split ruff and ty use: jemalloc where it builds, mimalloc on Windows (jemalloc
# has no MSVC support), the platform allocator elsewhere. Keep the `cfg`s in `src/lib.rs` in
# step with these. jemalloc is tuned for a short run on many threads in `../.cargo/config.toml`.
[target.'cfg(all(not(target_os = "windows"), not(target_os = "openbsd"), not(target_os = "aix"), not(target_os = "android"), any(target_arch = "x86_64", target_arch = "aarch64", target_arch = "powerpc64", target_arch = "riscv64")))'.dependencies]
# No initial-exec TLS: that model fails to `dlopen` into a process that did not link jemalloc at start (the extension module).
tikv-jemallocator = { version = "0.7", features = ["disable_initial_exec_tls"] }

[target.'cfg(target_os = "windows")'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }

[dev-dependencies]
tempfile = "3.8"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "parser_bench"
harness = false
