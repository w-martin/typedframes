[project]
name = "sqlalchemy-connector-example"
version = "0.1.0"
description = "Runnable typedframes example: SQL column inference for SQLAlchemy"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.1.5",
    "psycopg2-binary>=2.9.13",
    "pandas>=3.0.6",
]

[dependency-groups]
dev = [
    "typedframes[mypy]",
]

[tool.uv.sources]
typedframes = { path = "../../..", editable = true }

[tool.typedframes]
enabled = true
