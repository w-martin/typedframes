[project]
name = "bigquery-connector-example"
version = "0.1.0"
description = "Runnable typedframes example: SQL column inference against BigQuery"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-bigquery>=3.46.2",
    "pandas-gbq>=0.35.3",
    "pandas>=3.1.0",
    "db-dtypes>=1.9.0",
]

[dependency-groups]
dev = [
    "typedframes[mypy]",
]

[tool.uv.sources]
typedframes = { path = "../../..", editable = true }

[tool.typedframes]
enabled = true
sql_dialect = "bigquery"
