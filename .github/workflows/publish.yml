name: CI & Publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC — catches toolchain/dep drift on main
    - cron: "0 9 * * 1"  # Weekly Monday 09:00 UTC (security-audit)

jobs:
  lint-and-test:
    name: lint-and-test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # `uv sync` builds the project too, which compiles the `typedframes` executable and installs
      # it into the environment; the Python tests and the integration tests run it.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Rust format check
        run: cargo fmt --all -- --check
        working-directory: rust

      - name: Rust lint
        run: cargo clippy --workspace -- -D warnings
        working-directory: rust

      - name: Rust tests
        run: cargo test --workspace
        working-directory: rust

      - name: Python format check
        run: uv run inv format-check

      - name: Python lint
        run: uv run inv lint

      - name: Python tests
        run: uv run inv test

      - name: Verify licenses
        run: uv run inv verify-licences

      - name: Upload coverage to Coveralls
        if: matrix.python-version == '3.15'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: coverage.lcov

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Rust audit
        run: cargo audit
        working-directory: rust

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Python audit
        run: uv run pip-audit

  verify-version:
    name: Verify tag matches pyproject.toml version
    needs: [lint-and-test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "//' | sed 's/"//')
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: tag v${TAG_VERSION} does not match pyproject.toml version ${PKG_VERSION}"
            exit 1
          fi
          echo "Version check passed: ${PKG_VERSION}"

  build_wheels:
    name: Build wheels (${{ matrix.target }})
    needs: [verify-version]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            # jemalloc fixes its page size when it is built; 64 KiB also covers aarch64 kernels
            # with larger pages. Ruff builds its aarch64 wheels the same way (astral-sh/ruff#3791).
            docker_options: -e JEMALLOC_SYS_WITH_LG_PAGE=16
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      # The wheel is built with `bindings = "bin"`, which cannot build the extension module that runs
      # the checker inside the Python interpreter. It is built on its own and staged into the package,
      # where the wheel's `include` picks it up.
      - name: Build the extension module
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out ../../extension-dist
          working-directory: rust/python
          manylinux: auto
          docker-options: ${{ matrix.docker_options }}

      - name: Stage the extension module
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile

          with ZipFile(next(Path("extension-dist").glob("*.whl"))) as wheel:
              for member in wheel.namelist():
                  name = Path(member).name
                  if name.startswith("_rust.") and Path(name).suffix in {".so", ".pyd"}:
                      Path("src/typedframes", name).write_bytes(wheel.read(member))

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --profile cli --out dist
          manylinux: auto
          docker-options: ${{ matrix.docker_options }}

      - name: Check the wheel holds the executable and the extension module
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile

          names = ZipFile(next(Path("dist").glob("*.whl"))).namelist()
          assert any("/scripts/typedframes" in n for n in names), "executable missing"
          assert any(Path(n).name.startswith("_rust.") and n.startswith("typedframes/") for n in names), "extension missing"

      # Loading is what fails when the extension is linked wrongly (e.g. jemalloc's TLS model), not the
      # file being absent. Only on runners that can run the target.
      - name: Load the extension module from the wheel
        if: contains(fromJSON('["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]'), matrix.target)
        shell: bash
        run: |
          python -m venv check-venv
          if [ -d check-venv/Scripts ]; then PY=check-venv/Scripts/python; else PY=check-venv/bin/python; fi
          $PY -m pip install --no-index --find-links dist typedframes
          mkdir -p check-project && echo "x = 1" > check-project/a.py
          TYPEDFRAMES_INPROC=1 $PY -m typedframes check check-project --no-cache

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  # Static musl executables for containers and hosts without Python. Not gated on verify-version so a
  # manual dispatch can dry-run it; on a tag, `publish` still depends on verify-version via build_wheels.
  build_static_binaries:
    name: Static binary (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            # Same jemalloc page-size pin as the aarch64 wheel.
            jemalloc_page: "16"
    steps:
      - uses: actions/checkout@v4

      - name: Install zig and cargo-zigbuild
        run: pip install cargo-zigbuild ziglang

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      # Set only when the matrix gives a value: an empty JEMALLOC_SYS_WITH_LG_PAGE reaches configure as
      # `--with-lg-page=` and jemalloc then fails to compile.
      - name: Build
        run: |
          if [ -n "${{ matrix.jemalloc_page }}" ]; then
            export JEMALLOC_SYS_WITH_LG_PAGE=${{ matrix.jemalloc_page }}
          fi
          cargo zigbuild --profile cli --target ${{ matrix.target }} --bin typedframes
        working-directory: rust

      - name: Check the executable is static
        run: |
          BIN=rust/target/${{ matrix.target }}/cli/typedframes
          file "$BIN"
          if readelf -l "$BIN" | grep -q INTERP || readelf -d "$BIN" | grep -q NEEDED; then
            echo "::error::$BIN links dynamically"
            exit 1
          fi

      - name: Run it on a fixture
        run: |
          BIN="$PWD/rust/target/${{ matrix.target }}/cli/typedframes"
          mkdir check-project && echo "x = 1" > check-project/a.py
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get update && sudo apt-get install -y qemu-user-static
            qemu-aarch64-static "$BIN" check check-project --no-cache
          else
            "$BIN" check check-project --no-cache
          fi

      - name: Package
        run: |
          NAME="typedframes-${{ matrix.target }}"
          mkdir -p "release-assets/$NAME"
          cp rust/target/${{ matrix.target }}/cli/typedframes LICENSE "release-assets/$NAME/"
          tar -C release-assets -czf "release-assets/$NAME.tar.gz" "$NAME"
          rm -r "release-assets/$NAME"
          (cd release-assets && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: release-assets/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: static-${{ matrix.target }}
          path: release-assets/*

  build_sdist:
    name: Build sdist
    needs: [verify-version]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [ build_wheels, build_sdist, build_static_binaries ]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      # Kept apart from dist/: the PyPI action uploads everything in it, and a binary tarball is not an sdist.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{wheels-*,sdist}"
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: static-*
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            release-assets/*

  test-published:
    needs: [publish]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install published package
        id: install
        # Doesn't fail the run: PyPI availability lagging behind a successful
        # publish (see the step's own comment) isn't evidence anything is wrong
        # with the release, so it's a warning annotation, not a red workflow --
        # `continue-on-error` plus the `if` on the next step is what keeps a
        # download hiccup from crying wolf about the release itself.
        continue-on-error: true
        run: |
          # 30 attempts / 60s apart = up to 30 minutes. Was 20 attempts / 30s (10
          # min), before that 10 attempts / 30s (5 min): too tight for PyPI's
          # Fastly CDN, which can serve a stale simple-index page from a
          # not-yet-invalidated edge node for several minutes after a publish --
          # seen in practice on the v0.4.1 release, where this job alone (of five
          # running the same install within the same second) kept missing the new
          # version for the full 5-minute window while its matrix siblings found
          # it on their first attempt, and again on v0.8.0, where the 10-minute
          # window itself ran out.
          #
          # v0.8.0 also showed this isn't uniform propagation delay: the other
          # four Python versions in this same matrix all found the release on
          # their FIRST retry, within a second of each other, while this one kept
          # missing it for the entire window -- one runner stuck on one stale
          # Fastly edge, not PyPI-wide lag. Polling through pip can't dodge that:
          # `pip install --index-url <url>?cb=...` doesn't help, since pip's own
          # URL-joining drops a base index URL's query string when it resolves the
          # package path onto it. Polling PyPI's per-version JSON endpoint with
          # curl instead, with a fresh random query string every attempt, at
          # least gives a stuck edge node a reason to treat each request as a
          # fresh cache miss rather than replaying the same stale answer.
          VERSION="${GITHUB_REF#refs/tags/v}"
          FOUND=false
          for i in {1..30}; do
            if curl -fsS "https://pypi.org/pypi/typedframes/${VERSION}/json?cb=${RANDOM}-$(date +%s%N)" -o /dev/null; then
              FOUND=true
              break
            fi
            if [ "$i" -eq 30 ]; then
              break
            fi
            echo "Attempt $i: typedframes==${VERSION} not yet visible on PyPI, retrying in 60s..."
            sleep 60
          done
          if [ "$FOUND" = "false" ]; then
            echo "::warning::typedframes==${VERSION} was not visible on PyPI within 30 minutes of publish (likely a stale CDN edge stuck on this one runner -- see this step's comment). The release itself (wheels + sdist + GitHub release) already succeeded; only this post-publish smoke test couldn't confirm it this cycle."
            echo "installed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          pip install "typedframes==${VERSION}" pytest mypy pandera pandas polars
          echo "installed=true" >> "$GITHUB_OUTPUT"

      - name: Run tests against published package
        if: steps.install.outputs.installed == 'true'
        run: |
          rm -rf src pyproject.toml
          pytest tests/integration/
