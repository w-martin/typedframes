[workspace]
# `domain` is the analysis, `app` the use cases on top of it, `adapters` the ports implemented on the
# real system, and `cli` the command line, which wires them together.
# `python` is the PyO3 glue: PyO3's macros expand to `unsafe`, which the other crates forbid, so it is a
# crate of its own.
members = ["crates/domain", "crates/app", "crates/adapters", "crates/cli", "python"]
resolver = "2"

[workspace.package]
version = "0.15.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/w-martin/typedframes"
homepage = "https://github.com/w-martin/typedframes"
documentation = "https://github.com/w-martin/typedframes"

[workspace.dependencies]
typedframes_domain = { path = "crates/domain" }
typedframes_app = { path = "crates/app" }
typedframes_adapters = { path = "crates/adapters" }
typedframes_cli = { path = "crates/cli" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.16.2" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.16.2" }
ruff_source_file = { git = "https://github.com/astral-sh/ruff", tag = "0.16.2" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.16.2" }
ruff_notebook = { git = "https://github.com/astral-sh/ruff", tag = "0.16.2" }
ruff_diagnostics = { git = "https://github.com/astral-sh/ruff", tag = "0.16.2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
rmp-serde = "1"
anyhow = "1.0"
toml = { version = "1.1", features = ["preserve_order"] }
sqlparser = { version = "0.62", default-features = false, features = ["std", "recursive-protection"] }
clap = { version = "4.6.7", features = ["derive"] }
tikv-jemallocator = { version = "0.7", features = ["disable_initial_exec_tls"] }
mimalloc = { version = "0.1.52", default-features = false }
tempfile = "3.8"
criterion = { version = "0.8", features = ["html_reports"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "warn"
# Thresholds live in clippy.toml.
too_many_lines = "deny"
cognitive_complexity = "deny"
excessive_nesting = "deny"

[profile.release]
lto = true
codegen-units = 1
# Panics unwind (the default): this profile also builds the extension module, where a panic must become
# a Python exception and not end the interpreter that loaded it.
strip = "symbols"

# The executable wheel is built with this profile: it never loads into another process, so a panic
# may end it, and it favours size over the last ~10% of speed. The extension module keeps `release`.
[profile.cli]
inherits = "release"
panic = "abort"
opt-level = "s"
