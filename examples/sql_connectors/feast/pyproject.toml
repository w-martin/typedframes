[project]
name = "feast-connector-example"
version = "0.1.0"
description = "Runnable typedframes example: feature-store column inference against Feast"
requires-python = ">=3.11"
dependencies = [
    "feast>=0.40",
    "pandas>=2.0",
]

[dependency-groups]
dev = [
    "typedframes[mypy]",
]

[tool.uv.sources]
typedframes = { path = "../../..", editable = true }

[tool.typedframes]
enabled = true
